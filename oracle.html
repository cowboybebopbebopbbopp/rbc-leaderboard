async function shareCard(){
  const b=meRow()||{name:S.me,wins:0,games:0,win_pct:0,streak:0,best_streak:0};
  const lv=levelOf(b), pos=(S.preds.board||[]).indexOf(b)+1;
  try{ await document.fonts.load('900 90px Unbounded'); await document.fonts.load('500 30px "IBM Plex Mono"'); }catch(e){}
  const cv=document.createElement('canvas'); cv.width=1080; cv.height=1350;
  const x=cv.getContext('2d');
  x.fillStyle='#07080B'; x.fillRect(0,0,1080,1350);
  for(let y=0;y<1350;y+=6){ x.fillStyle='rgba(242,239,230,.018)'; x.fillRect(0,y,1080,1); }
  x.strokeStyle='rgba(255,176,32,.55)'; x.lineWidth=4; x.strokeRect(36,36,1008,1278);
  x.textAlign='center';
  x.fillStyle='#565D6E'; x.font='500 26px "IBM Plex Mono"';
  x.fillText('О Р А К У Л   ·   К Т О   Т О Ч Н Е Е',540,120);
  /* существо: арт fal.ai или пиксель-спрайт */
  const art=await loadArt(ART+'lvl'+pad2(lv.n)+'.png', sprite(lv.spr));
  const artIsSpr=art.src.startsWith('data:');
  x.imageSmoothingEnabled=!artIsSpr;
  if(artIsSpr) x.drawImage(art,0,0,12,12,540-160,190,320,320);
  else x.drawImage(art,540-180,180,360,360);
  x.fillStyle='#F2EFE6'; x.font='900 72px Unbounded';
  x.fillText(b.name.slice(0,16),540,620);
  x.fillStyle='#FFB020'; x.font='700 32px Unbounded';
  x.fillText(('УР.'+lv.n+' · '+lv.name+(pos===1?' · №1':pos>0?' · №'+pos:'')).toUpperCase(),540,690);
  x.fillStyle='#565D6E'; x.font='italic 500 26px "IBM Plex Mono"';
  x.fillText('«'+lv.hint+'»',540,740);
  const stats=[[String(b.wins),'ПОБЕД','#2CE08B'],[Math.round(b.win_pct)+'%','ТОЧНОСТЬ','#F2EFE6'],
               [String(b.streak),'СЕРИЯ','#FFB020'],[String(b.best_streak),'РЕКОРД','#F2EFE6']];
  stats.forEach((s,i)=>{ const cx=180+i*240;
    x.strokeStyle='rgba(244,241,232,.12)'; x.lineWidth=1;
    if(i) { x.beginPath(); x.moveTo(cx-120,830); x.lineTo(cx-120,1010); x.stroke(); }
    x.fillStyle=s[2]; x.font='900 84px Unbounded'; x.fillText(s[0],cx,940);
    x.fillStyle='#565D6E'; x.font='500 22px "IBM Plex Mono"'; x.fillText(s[1],cx,990); });
  /* медали — те же, что на карточке: по инструменту каждого угаданного конкурса */
  const mywins=winsOf(b.pid,b.name).slice(0,6);
  if(mywins.length){
    const syms=mywins.map(c=>S.charts[chartIdOf(c)]?.symbol||seriesSym(c));
    const imgs=await Promise.all(syms.map(sym=>
      loadArt(ART+'medal_'+(sym||'X')+'.png', sprite('coin',SYMG[sym]||'?'))));
    const cw=64, gap=18, total=imgs.length*cw+(imgs.length-1)*gap;
    imgs.forEach((im,i)=>{ const cx0=540-total/2+i*(cw+gap);
      const isSpr=im.src.startsWith('data:');
      x.imageSmoothingEnabled=!isSpr;
      if(isSpr) x.drawImage(im,0,0,12,12,cx0,1060,cw,cw);
      else x.drawImage(im,cx0,1060,cw,cw); }); }
  x.fillStyle='#565D6E'; x.font='500 24px "IBM Plex Mono"';
  x.fillText('прогноз-лига форума «РБК Крипто»',540,1210);
  x.fillStyle='#FFB020'; x.font='600 30px "IBM Plex Mono"'; x.fillText('#ктоточнее',540,1258);
  cv.toBlob(async bl=>{ const f=new File([bl],'oracle.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f]}); return;}catch(e){} }
    const a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download='oracle.png'; a.click(); });
}

/* игрок: клик по имени. Имена в winners не уникальны (user_id наружу не отдаём),
   поэтому: одно совпадение — карточка; тёзки — выбор; нет в лиге — мини-карточка. */
function openPlayer(name){
  const bl=S.preds.board||[];
  const matches=bl.map((x,i)=>[x,i]).filter(([x])=>x.name===name);
  if(matches.length===1) return openPlayerIdx(matches[0][1]);
  if(matches.length>1){
    $('#sheetbody').innerHTML=`<div class="sh-title">${esc(name)} — тёзки</div>
      <div class="k" style="margin-bottom:4px">в лиге ${matches.length} игрока с этим именем — выбери</div>
      ${matches.map(([x,i])=>`<div class="cand" data-i="${i}">${beastImg(levelOf(x),30)} ${esc(x.name)}
        <span class="st">${x.wins}/${x.games} · №${i+1}</span></div>`).join('')}
      <div class="k" style="margin-top:10px">в сезонной таблице их победы складываются — по имени их не различить</div>`;
    showSheet();
    $$('#sheetbody .cand').forEach(el=>el.onclick=()=>openPlayerIdx(+el.dataset.i));
    return;
  }
  let pid=null;
  for(const c of contests()){ const i=(c.winners||[]).indexOf(name);
    if(i>=0&&winnerPid(c,i)!=null){ pid=winnerPid(c,i); break; } }
  if(pid!=null&&boardByPid(pid)) return openPlayerPid(pid);
  const wins=winsOf(pid,name);
  $('#sheetbody').innerHTML=`<div style="text-align:center;padding-top:8px">
    <div style="display:flex;justify-content:center">${beastImg({n:1,spr:'plankton'},72)}</div>
    <div class="sh-title" style="margin-top:10px">${esc(name)}</div>
    <div class="k" style="margin-top:6px">угадал ${wins.length} — в таблице лиги пока не числится</div>
    ${wins.length?`<div class="undernote" style="margin-top:12px;text-align:left">золото: ${wins.map(c=>esc(symName(S.charts[chartIdOf(c)]?.symbol))+' '+fmtD(c.target_time)).join(' · ')}</div>`:''}
  </div>`;
  showSheet();
}
function openPlayerPid(pid){ const i=(S.preds.board||[]).findIndex(b=>b.pid===pid);

     кнопки или startapp. Один раз запомнили — дальше узнаём сами. */
  const urlPid=readPid();
  if(urlPid!=null){ S.pid=urlPid; S.verified=true;          // выдал бот — Telegram подтвердил, кто это
    localStorage.setItem('oracle_pid',String(urlPid)); localStorage.setItem('oracle_verified','1');
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  else { const st=+localStorage.getItem('oracle_pid'); if(st){ S.pid=st;
    S.verified=localStorage.getItem('oracle_verified')==='1'; } }
  S.me=localStorage.getItem('oracle_me')||null;
  try{ S.bets=JSON.parse(localStorage.getItem('oracle_bets')||'{}'); }catch(e){ S.bets={}; }
  S.sound=!!localStorage.getItem('oracle_sound');
  $$('#sndbtn,#sndfloat').forEach(b=>b.classList.toggle('on',S.sound));
  setIcon($('#sndico'),'volume'); setIcon($('#sndico2'),'volume');
  try{ await loadData(); }catch(e){
    $('#v-live').innerHTML=`<div class="err">Не удалось загрузить predictions.json / pred_charts.json.<br>Открой страницу через сервер сайта, не как файл.</div>`;
    return;
  }
  tgAutoLogin();
  const mr0=meRow(); if(mr0&&mr0.name!==S.me){ S.me=mr0.name; localStorage.setItem('oracle_me',S.me); }
  renderAll();
  applyStagger($('#v-live'));
  const recId=readReplayParam();
  if(recId){ document.body.classList.add('rec'); S.sound=false;
    if(!contests().some(c=>c.status==='resolved'&&chartIdOf(c)===recId)){ document.title='replay-missing'; return; }
    runRecording(recId); return; }
  setInterval(async()=>{ try{ await loadData(); renderAll(); }catch(e){} },3e5);
  document.addEventListener('visibilitychange',async()=>{ if(!document.hidden){
    try{ await loadData(); renderAll(); }catch(e){} maybeAskMark(); } });
  addEventListener('resize',()=>{ if($('#v-live').classList.contains('on')) renderLive(); });
  /* переход по ссылке бота при уже открытой странице (смена #pid не перезагружает) */
  addEventListener('hashchange',()=>{ const p=readPid();
    if(p!=null&&p!==S.pid){ S.pid=p; S.verified=true;
      localStorage.setItem('oracle_pid',String(p)); localStorage.setItem('oracle_verified','1');
      const r=meRow(); if(r){ S.me=r.name; localStorage.setItem('oracle_me',S.me); }
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
      renderAll(); switchTab('me'); } });
})();
</script>
</body>
</html>
