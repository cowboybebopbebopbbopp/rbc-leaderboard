<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<title>Оракул — Кто точнее</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     СИСТЕМА. Шесть ролей текста, сетка 4px, один акцент.
     Капс — только ярлык-разделитель (.k) и звание (.plvl).
     Повторяющиеся подписи в списках — строчными, приглушённым цветом.
     ============================================================ */
  :root{
    --ink:#07080B; --ink2:#0C0E13; --ink3:#12151C;
    --hair:rgba(244,241,232,.07); --hair2:rgba(244,241,232,.13);
    --fg:#F2EFE6; --mut:#9AA3B7; --dim:#6B7488;
    --amber:#FFB020; --green:#2CE08B; --red:#FF5252;
    --f-disp:'Unbounded',ui-sans-serif,system-ui,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-back:cubic-bezier(.34,1.56,.64,1);
    --ease-inout:cubic-bezier(.65,0,.35,1);
    --t1:.12s; --t2:.22s; --t3:.42s;
    color-scheme:dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--ink); color:var(--fg); font-family:var(--f-mono); font-size:15px}
  body{min-height:100dvh; overscroll-behavior-y:none; line-height:1.5}
  #app{max-width:560px; margin:0 auto; padding:0 var(--s4) calc(88px + env(safe-area-inset-bottom))}
  a{color:inherit; text-decoration:none}
  button{font-family:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer}
  svg.px{display:inline-block; vertical-align:-3px; width:1em; height:1em; fill:currentColor}
  img.spr{image-rendering:pixelated; display:block}
  img.ai{display:block}
  .k{font-weight:500; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}

  /* ===== шапка: в Telegram скрыта, там свой заголовок ===== */
  header{display:flex; align-items:center; justify-content:space-between;
    padding:calc(var(--s4) + env(safe-area-inset-top)) 0 var(--s3)}
  body.tg header{display:none}
  .logo{display:flex; align-items:center; gap:var(--s2); font-family:var(--f-disp);
    font-weight:900; font-size:17px; letter-spacing:.18em}
  .logo svg{width:20px; height:20px; color:var(--amber)}
  .logo small{display:block; font-family:var(--f-mono); font-weight:400; font-size:11px;
    letter-spacing:.04em; color:var(--dim); margin-top:2px; text-transform:none}
  #sndbtn{width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    color:var(--dim); transition:color var(--t2) var(--ease-out), transform var(--t1)}
  #sndbtn.on{color:var(--amber)}
  #sndbtn:active{transform:scale(.9)}
  #sndbtn svg{width:19px; height:19px}
  #sndfloat{display:none; position:fixed; top:calc(var(--s2) + env(safe-area-inset-top)); right:var(--s3);
    z-index:40; width:40px; height:40px; align-items:center; justify-content:center;
    color:var(--dim); background:rgba(7,8,11,.7); border-radius:50%; backdrop-filter:blur(8px)}
  body.tg #sndfloat{display:flex}
  #sndfloat.on{color:var(--amber)}
  #sndfloat svg{width:17px; height:17px}

  /* ===== секции ===== */
  main section{display:none}
  main section.on{display:block; animation:fade var(--t1) linear both}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  main section>:first-child{margin-top:var(--s4)}
  body.tg main section>:first-child{margin-top:calc(var(--s6) + env(safe-area-inset-top))}
  @keyframes enter{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  .sect{margin:var(--s6) 0 var(--s2)}
  .sect h2{font-family:var(--f-disp); font-size:15px; font-weight:700; letter-spacing:.02em; margin:0; color:var(--fg)}
  .sect .k{margin-top:var(--s1)}

  /* ===== ЭФИР ===== */
  .ticker{display:flex; align-items:baseline; gap:var(--s3)}
  .ticker .price{font-family:var(--f-disp); font-weight:900; font-size:38px; letter-spacing:0}
  .ticker .asset{font-size:13px; color:var(--mut); line-height:1.35}
  .statusline{margin-top:var(--s2); font-size:13px; color:var(--mut)}
  .statusline b{color:var(--amber); font-weight:600}
  .bigstate{font-family:var(--f-disp); font-weight:700; font-size:18px; line-height:1.35; margin:var(--s4) 0 0}
  .bigstate.win{color:var(--green)} .bigstate.warn{color:var(--amber)}
  .ladderwrap{position:relative; margin:var(--s4) -6px 0}
  canvas.ladder{display:block; width:100%; touch-action:manipulation}
  .confetti{position:absolute; inset:0; pointer-events:none}
  .undernote{margin-top:var(--s3); font-size:13px; color:var(--mut)}
  .undernote b{color:var(--fg); font-weight:600}
  .marknote{display:flex; align-items:center; gap:var(--s2); margin-top:var(--s3); font-size:13px; color:var(--amber)}
  .marknote svg{width:14px; height:14px; flex:none}
  .marknote small{color:var(--dim); margin-left:auto; font-size:12px}

  .cta{display:flex; align-items:center; justify-content:center; gap:var(--s2); width:100%;
    background:var(--amber); color:#140D02; font-family:var(--f-disp); font-weight:700; font-size:15px;
    padding:var(--s4); border-radius:12px; min-height:52px;
    transition:transform var(--t1) var(--ease-out)}
  .cta:active{transform:scale(.98)}
  .cta svg{width:17px; height:17px}
  .cta.ghost{background:none; color:var(--mut); border:1px solid var(--hair2); font-weight:500;
    font-family:var(--f-mono); font-size:14px}

  /* ===== ТАБЫ ===== */
  nav#tabs{position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:rgba(7,8,11,.9); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--hair); padding-bottom:env(safe-area-inset-bottom)}
  nav#tabs .inner{max-width:560px; margin:0 auto; display:flex}
  nav#tabs button{flex:1; padding:var(--s2) 0; display:flex; flex-direction:column;
    align-items:center; gap:var(--s1); color:var(--dim); font-size:11px; font-weight:500;
    min-height:52px; transition:color var(--t2) var(--ease-out); position:relative}
  nav#tabs button svg, nav#tabs button img{width:22px; height:22px; transition:transform var(--t2) var(--ease-out)}
  nav#tabs button.on{color:var(--amber)}
  nav#tabs button.on svg, nav#tabs button.on img{transform:translateY(-1px)}
  nav#tabs .dot{position:absolute; top:6px; right:calc(50% - 16px); width:5px; height:5px; border-radius:99px; background:var(--amber)}

  /* ===== ФИНИШИ ===== */
  .frow{display:flex; align-items:center; gap:var(--s3); padding:var(--s3) 0; min-height:64px;
    border-bottom:1px solid var(--hair); cursor:pointer}
  .frow:last-child{border-bottom:none}
  .frow img{width:42px; height:42px; flex:none}
  .frow .t1{font-size:15px; font-weight:600}
  .frow .t2{font-size:13px; color:var(--dim); margin-top:2px}
  .frow .fin{margin-left:auto; text-align:right; flex:none}
  .frow .fin b{display:block; color:var(--green); font-weight:600; font-size:15px}
  .frow .fin span{font-size:12px; color:var(--dim)}
  .youbadge{display:inline-flex; align-items:center; gap:var(--s1); color:var(--amber); font-size:13px; font-weight:600}
  .youbadge svg{width:12px; height:12px}

  /* ===== РЕПЛЕЙ ===== */
  #replay{position:fixed; inset:0; z-index:100; background:var(--ink); display:none;
    overflow-y:auto; padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom))}
  #replay.on{display:block; animation:fade var(--t2) linear both}
  #replay .bar{display:flex; align-items:center; justify-content:space-between; max-width:560px; margin:0 auto var(--s2)}
  #replay .bar button{width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--mut)}
  #replay .bar button svg{width:18px; height:18px}
  #replay .inner{max-width:560px; margin:0 auto}
  #rclock{font-size:13px; color:var(--dim)}
  /* режим записи ролика (#replay=<id>&rec=1, render_replay.py): только сцена реплея,
     без шапки, вкладок, звука и кнопок — headless Chromium пишет видео для поста */
  body.rec header, body.rec nav#tabs, body.rec #sndfloat, body.rec main{display:none}
  body.rec #replay .bar button{visibility:hidden}
  body.rec #resheet .cta, body.rec #resheet .wtag{pointer-events:none}
  body.rec #resheet .cta{display:none}
  /* карточки сценария записи (shorts-монтаж): хук → реплей → финиш-цифры → звания → топ-10 → призыв.
     Карточка въезжает снизу (slide-cut), заголовки «вбиваются» (slam), строки влетают справа,
     сверху — сегментный прогресс-бар как в сторис, на склейках — вспышка */
  /* #reccard — прозрачный контейнер, каждая карточка — свой лист .pg с фоном. Смена карточек — «пуш»:
     старый лист уезжает вверх, новый в тот же момент въезжает снизу, шов между ними не расходится
     (раньше на стыке на кадр-другой проглядывала застывшая лестница гонки) */
  #reccard{position:fixed; inset:0; z-index:120; display:none; overflow:hidden}
  #reccard .pg{position:absolute; inset:0; background:var(--ink); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:0 28px;
    transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  #reccard .pg.on{transform:none}
  #reccard .pg.out{transform:translateY(-100%)}
  #reccard .pg.cut{transition:none}
  #reccard .pg::before{content:''; position:absolute; left:50%; top:46%; width:440px; height:440px; transform:translate(-50%,-50%);
    border-radius:50%; background:radial-gradient(closest-side, rgba(255,176,32,.16), transparent 72%); pointer-events:none}
  #reccard .pg>*{position:relative}
  @keyframes recSlam{0%{opacity:0; transform:scale(2.4)} 55%{opacity:1; transform:scale(.95)} 100%{transform:scale(1)}}
  @keyframes recRise{from{opacity:0; transform:translateY(34px)} to{opacity:1; transform:none}}
  @keyframes recSlide{from{opacity:0; transform:translateX(52px)} to{opacity:1; transform:none}}
  @keyframes recPulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.07)}}
  @keyframes recPunch{0%{transform:scale(1)} 30%{transform:scale(1.08)} 100%{transform:scale(1)}}
  @keyframes recFlash{from{opacity:.65} to{opacity:0}}
  @keyframes recBounce{0%,100%{transform:translateY(0)} 50%{transform:translateY(9px)}}
  #reccard .k{font-family:var(--f-mono); font-size:15px; color:var(--mut); letter-spacing:.08em; text-transform:uppercase; animation:recRise .35s both}
  #reccard .big{font-family:var(--f-disp); font-weight:900; font-size:40px; line-height:1.04; color:var(--amber); margin:14px 0 10px;
    animation:recSlam .42s cubic-bezier(.2,.9,.3,1.15) both}
  #reccard .sub{font-family:var(--f-disp); font-weight:700; font-size:18px; color:var(--fg); margin-top:6px; animation:recRise .4s .16s both}
  #reccard .dim{font-family:var(--f-mono); font-size:15px; color:var(--mut); margin-top:18px; animation:recRise .4s .3s both}
  #reccard .huge{font-family:var(--f-disp); font-weight:900; font-size:54px; line-height:1; color:var(--green); margin:10px 0 2px; animation:recSlam .45s both}
  #reccard .num{font-family:var(--f-disp); font-weight:900; font-size:72px; line-height:1; color:var(--amber); margin-top:26px; animation:recSlam .45s .1s both}
  #reccard .arrow{margin-top:22px; color:var(--amber); font-size:30px; animation:recBounce .8s .5s infinite}
  #reccard .ups{display:flex; flex-direction:column; gap:9px; margin-top:16px; width:100%; max-width:420px}
  #reccard .up{display:flex; align-items:center; gap:12px; padding:8px 12px; border:1px solid #1F232C; border-radius:12px;
    background:var(--ink2); text-align:left; animation:recSlide .3s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(.15s + var(--i)*.2s)}
  #reccard .up img{width:48px; height:48px; image-rendering:pixelated; flex:none}
  #reccard .up .n{font-family:var(--f-disp); font-weight:700; font-size:16px; color:var(--fg); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #reccard .up .t{font-family:var(--f-mono); font-size:15px; color:var(--amber); white-space:nowrap}
  #reccard .ctabtn{margin-top:24px; padding:14px 26px; border-radius:14px; background:var(--amber); color:var(--ink);
    font-family:var(--f-disp); font-weight:900; font-size:18px; animation:recSlam .45s .2s both, recPulse 1.1s 1s infinite}
  #recbar{position:fixed; top:10px; left:14px; right:14px; z-index:130; display:none; gap:5px}
  body.rec #recbar{display:flex}
  #recbar i{flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.14); overflow:hidden; position:relative}
  #recbar i::after{content:''; position:absolute; inset:0; width:0; background:var(--amber)}
  #recbar i.done::after{width:100%}
  #recbar i.active::after{width:100%; transition:width var(--d,3s) linear}
  #recflash{position:fixed; inset:0; z-index:125; background:var(--amber); opacity:0; pointer-events:none; display:none}
  body.rec #recflash.go{display:block; animation:recFlash .22s both}
  body.rec .ladderwrap.punch{animation:recPunch .5s cubic-bezier(.2,.8,.2,1) both}
  /* переход хук → гонка: «ИТОГ» раздувается до жёлтой заливки (#reccover держит цвет, пока камера
     встаёт на точку), затем заливка схлопывается в точку и камера летит за ней (recFlight) */
  @keyframes recZoomIn{to{transform:scale(34)}}
  #reccard .big.zoom{animation:recZoomIn .42s cubic-bezier(.55,0,.9,.35) forwards}
  #reccover{position:fixed; inset:0; z-index:140; background:var(--amber); display:none; opacity:0;
    clip-path:circle(120% at 50% 42%); transition:opacity .26s ease-out, clip-path .45s cubic-bezier(.7,0,.3,1)}
  #reccard.jolt{animation:shake .3s .1s both}
  body.rec .ladderwrap{will-change:transform}
  /* 3D-пролёт за точкой (recFlight): отдельный холст поверх реплея, границы зон — рельсы в перспективе */
  #rec3d{position:fixed; inset:0; z-index:115; width:100%; height:100%; display:none; pointer-events:none}
  /* карточка «Топ-10 рейтинга»: плотнее, спрайты мельче, строки быстрее, лидер подсвечен */
  #reccard .top{gap:7px; margin-top:12px}
  #reccard .top .up{padding:5px 10px; gap:10px; animation-delay:calc(.1s + var(--i)*.15s)}
  #reccard .top .up img{width:40px; height:40px}
  #reccard .top .n{font-size:15px}
  #reccard .top .up.first{border-color:var(--amber); box-shadow:0 0 0 1px rgba(255,176,32,.35), 0 0 26px rgba(255,176,32,.18)}
  #reccard .top .up.first .n svg{width:14px; height:14px; color:var(--amber); vertical-align:-2px; margin-right:6px}
  #reccard .pos{font-family:var(--f-mono); font-size:15px; color:var(--amber); width:22px; text-align:right; flex:none}
  #reccard .sc{font-family:var(--f-mono); font-size:13px; color:var(--mut); white-space:nowrap}
  #reccard .won{font-style:normal; font-family:var(--f-mono); font-size:13px; color:var(--green); margin-left:6px}
  /* хук: вопрос-зацепка под «ИТОГ» */
  #reccard .q{font-family:var(--f-disp); font-weight:900; font-size:30px; line-height:1.15; color:var(--fg); margin-top:26px;
    animation:recRise .4s .22s both}
  /* «Новые звания», когда их мало (≤4): строки крупнее, кадр не пустеет */
  #reccard .ups.few{gap:12px}
  #reccard .ups.few .up{padding:12px 16px; gap:16px}
  #reccard .ups.few .up img{width:64px; height:64px}
  #reccard .ups.few .up .n{font-size:20px}
  #reccard .ups.few .up .t{font-size:16px}
  /* карточка финиша: «18 из 70» сеткой — квадрат на голос, угадавшие загораются зелёным по очереди */
  #reccard .dots{display:grid; gap:var(--g); margin-top:26px}
  #reccard .dots i{position:relative; width:var(--c); height:var(--c); border-radius:3px; background:#1A1E27; animation:recDot .25s both}
  #reccard .dots i b{position:absolute; inset:0; border-radius:3px; background:var(--green); box-shadow:0 0 10px rgba(44,224,139,.5);
    animation:recDotW .32s both}
  @keyframes recDot{from{opacity:0; transform:scale(.4)} to{opacity:1; transform:none}}
  @keyframes recDotW{0%{opacity:0; transform:scale(.3)} 60%{opacity:1; transform:scale(1.35)} 100%{opacity:1; transform:none}}
  #reccard .score{display:flex; align-items:baseline; justify-content:center; gap:14px; margin-top:22px}
  #reccard .score .num{margin-top:0}
  #reccard .score .of{font-family:var(--f-disp); font-weight:900; font-size:30px; color:var(--mut)}
  /* табло гонки (запись): время, цена крупно, зона и голоса за неё. Висит поверх и 3D-пролёта, и лестницы —
     один якорь для глаза через смену сцены; на финише зеленеет. Заполняет пустой низ вертикального кадра */
  #rechud{position:fixed; left:0; right:0; bottom:0; z-index:117; display:none; flex-direction:column; align-items:center;
    justify-content:flex-end; height:270px; padding-bottom:64px; text-align:center; pointer-events:none;
    background:linear-gradient(to bottom, rgba(7,8,11,0), rgba(7,8,11,.92) 38%)}
  body.rec #rechud.on{display:flex}
  #rechud .t{font-family:var(--f-mono); font-weight:500; font-size:15px; color:var(--mut); letter-spacing:.06em; text-transform:uppercase}
  #rechud .p{font-family:var(--f-disp); font-weight:900; font-size:56px; line-height:1.05; color:var(--amber); margin-top:6px;
    font-variant-numeric:tabular-nums}
  #rechud .z{font-family:var(--f-disp); font-weight:700; font-size:19px; color:var(--fg); margin-top:8px}
  #rechud .z b{color:var(--amber)}
  #rechud .z.tick{animation:recTick .3s ease-out}
  @keyframes recTick{0%{transform:scale(1.14)} 100%{transform:none}}
  #rechud.fin .t, #rechud.fin .z b{color:var(--green)}
  #rechud.fin .p{color:var(--green); animation:recPunch .5s cubic-bezier(.2,.8,.2,1) both}
  /* в записи время показывает табло, а итог — карточки сценария: часы и лист финиша приложения не нужны */
  body.rec #rclock{visibility:hidden}
  body.rec #resheet{display:none}
  #rstage{position:relative}
  #rstage.shake{animation:shake .18s linear}
  @keyframes shake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}
  .verdict{font-family:var(--f-disp); font-weight:900; font-size:30px; margin:var(--s4) 0 var(--s1);
    animation:pop .5s var(--ease-back) both}
  .verdict.win{color:var(--green)} .verdict.lose{color:var(--red)} .verdict.neutral{color:var(--amber)}
  @keyframes pop{from{opacity:0; transform:scale(.8)} to{opacity:1; transform:none}}
  .r-price{font-family:var(--f-disp); font-weight:700; font-size:17px; color:var(--fg)}
  .r-price b{color:var(--green)}
  .r-sub{font-size:13px; color:var(--mut); margin-top:var(--s2)}
  .wgrid{display:flex; flex-wrap:wrap; gap:var(--s2); margin-top:var(--s3)}
  .wtag{display:inline-flex; align-items:center; gap:var(--s2); border:1px solid var(--hair2); border-radius:10px;
    padding:var(--s2) var(--s3); font-size:13px; min-height:40px;
    animation:enter var(--t2) var(--ease-out) both; animation-delay:calc(var(--i)*30ms)}
  .wtag img{width:20px; height:20px}
  .wtag.meish{border-color:var(--amber); color:var(--amber)}

  /* ===== ПРОФИЛЬ ===== */
  .plinth{position:relative; margin-top:var(--s4); padding:var(--s6) 0 var(--s4); text-align:center;
    overflow:hidden; border:1px solid var(--hair); border-radius:16px; background:var(--ink2)}

  .pname{font-family:var(--f-disp); font-weight:900; font-size:23px; margin-top:var(--s3)}

    color:var(--amber); font-weight:500}

  .xp{margin:var(--s4) var(--s4) 0; text-align:left}

  .stats4{display:flex; margin-top:var(--s4); border-top:1px solid var(--hair)}

  .stats4 .st:first-child{border-left:none}

  .stats4 b.grn{color:var(--green)} .stats4 b.red{color:var(--red)} .stats4 b.amb{color:var(--amber)}
  .stats4 span{display:block; margin-top:var(--s1); font-size:12px; color:var(--dim)}
  .stats4 .fireic{width:14px; height:14px; vertical-align:-2px; color:var(--amber)}

  .acc{display:flex; align-items:center; gap:var(--s4); margin-top:var(--s4);
    padding:var(--s4) var(--s4) 0; border-top:1px solid var(--hair)}
  .acc .big{font-family:var(--f-disp); font-weight:900; font-size:30px; flex:none}
  .accbars{flex:1}
  .accbars .row{display:flex; align-items:center; gap:var(--s2); font-size:12px; color:var(--dim); margin:var(--s1) 0}
  .accbars .bar{flex:1; height:5px; background:rgba(244,241,232,.07); border-radius:99px; overflow:hidden}
  .accbars .bar i{display:block; height:100%; width:0; transition:width 1s var(--ease-out) .4s}
  .accbars .me i{background:var(--amber)} .accbars .crowd i{background:var(--dim)}
  .accbars .val{width:36px; text-align:right; color:var(--mut)}

  /* служебная плашка — ниже статистики, не над ней */
  .idwarn{display:flex; align-items:center; gap:var(--s2); margin-top:var(--s3); padding:var(--s3);
    border:1px solid var(--hair2); border-radius:12px; font-size:13px; color:var(--mut);
    text-align:left; cursor:pointer; min-height:52px; transition:border-color var(--t2)}
  .idwarn:active{border-color:var(--amber)}
  .idwarn svg{width:16px; height:16px; color:var(--amber); flex:none}
  .idwarn b{color:var(--amber); white-space:nowrap; margin-left:auto}

  .medals{display:flex; flex-wrap:wrap; gap:var(--s4); margin-top:var(--s3)}
  .medal{text-align:center; animation:pop .5s var(--ease-back) both; animation-delay:calc(var(--i)*80ms)}
  .medal .coin{position:relative; width:58px; height:58px; margin:0 auto; overflow:hidden; border-radius:50%}
  .medal .coin img{width:58px; height:58px}
  .medal .coin::after{content:''; position:absolute; top:-20%; bottom:-20%; left:-40%; width:34%;
    background:linear-gradient(105deg, transparent, rgba(255,255,255,.35), transparent);
    transform:skewX(-18deg) translateX(-60px); animation:shine 3.2s var(--ease-inout) infinite; animation-delay:calc(var(--i)*.5s + .8s)}
  @keyframes shine{0%{transform:skewX(-18deg) translateX(-60px)} 18%{transform:skewX(-18deg) translateX(140px)} 100%{transform:skewX(-18deg) translateX(140px)}}
  .medal .cap{margin-top:var(--s2); font-size:12px; color:var(--dim)}

  .search{width:100%; background:none; border:none; border-bottom:1px solid var(--hair2); color:var(--fg);
    font-family:var(--f-mono); font-size:16px; padding:var(--s3) 2px; outline:none; margin-top:var(--s2);
    transition:border-color var(--t2)}

  .cand{display:flex; align-items:center; gap:var(--s3); padding:var(--s3) 2px; min-height:56px;
    border-bottom:1px solid var(--hair); cursor:pointer; font-size:15px}
  .cand img{width:30px; height:30px}
  .cand .st{margin-left:auto; color:var(--dim); font-size:13px}

  /* ===== ЦЕРЕМОНИЯ ЗВАНИЯ ===== */
  #levelup{position:fixed; inset:0; z-index:130; background:var(--ink); display:none;
    flex-direction:column; padding:calc(var(--s8) + env(safe-area-inset-top)) var(--s6) calc(var(--s6) + env(safe-area-inset-bottom))}
  #levelup.on{display:flex}
  .lu-stage{position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden}
  .lu-rays{position:absolute; width:340px; height:340px; border-radius:50%; opacity:0;
    background:repeating-conic-gradient(rgba(255,176,32,.13) 0 9deg, transparent 9deg 24deg);
    -webkit-mask:radial-gradient(circle,#000 18%,transparent 68%); mask:radial-gradient(circle,#000 18%,transparent 68%)}
  #levelup.go .lu-rays{animation:luRaysIn .7s var(--ease-out) .85s both, luSpin 26s linear .85s infinite}
  @keyframes luRaysIn{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:scale(1)}}
  @keyframes luSpin{to{transform:rotate(360deg)}}
  .lu-old,.lu-new{width:120px; height:120px; position:relative}
  .lu-new{position:absolute; opacity:0}
  #levelup.go .lu-old{animation:luOld .7s var(--ease-inout) .2s both}
  @keyframes luOld{0%{transform:scale(1)} 30%{transform:scale(1.07)} 100%{transform:scale(.45); opacity:0}}
  #levelup.go .lu-new{animation:luNew .6s var(--ease-back) .9s both}
  @keyframes luNew{from{opacity:0; transform:scale(.4)} to{opacity:1; transform:scale(1)}}
  .lu-kicker{margin-top:var(--s6); font-size:11px; letter-spacing:.24em; color:var(--dim); text-transform:uppercase; opacity:0}
  .lu-name{font-family:var(--f-disp); font-weight:900; font-size:29px; color:var(--amber); margin-top:var(--s2); opacity:0}
  .lu-hint{font-size:13px; color:var(--mut); font-style:italic; margin-top:var(--s2); opacity:0}
  #levelup.go .lu-kicker{animation:enter .4s var(--ease-out) 1.3s both}
  #levelup.go .lu-name{animation:pop .5s var(--ease-back) 1.45s both}
  #levelup.go .lu-hint{animation:enter .4s var(--ease-out) 1.7s both}
  #levelup .confetti{position:absolute; inset:0}

  /* ===== ОНБОРДИНГ ===== */
  #unlock{position:fixed; inset:0; z-index:120; background:var(--ink); display:none;
    padding:calc(56px + env(safe-area-inset-top)) var(--s6) var(--s8)}
  #unlock.on{display:flex; flex-direction:column}
  #unlock .big{font-family:var(--f-disp); font-weight:900; font-size:25px; animation:pop .5s var(--ease-back) both}
  #unlock .items{margin-top:var(--s8); display:flex; flex-direction:column; gap:var(--s6)}
  #unlock .it{display:flex; gap:var(--s4); align-items:flex-start; animation:enter .4s var(--ease-out) both}
  #unlock .it svg{width:22px; height:22px; color:var(--amber); flex:none; margin-top:2px}

  #unlock .cta{margin-top:auto}

  /* ===== ЛИГА ===== */
  .lgtabs{display:flex; gap:var(--s2)}
  .lgt{padding:var(--s3) var(--s4); border:1px solid var(--hair2); border-radius:10px; font-size:13px;
    color:var(--mut); font-weight:500; min-height:44px; transition:all var(--t2) var(--ease-out)}
  .lgt.on{color:var(--amber); border-color:rgba(255,176,32,.5)}
  .lgt:active{transform:scale(.97)}
  .champline{display:flex; align-items:center; gap:var(--s2); margin-top:var(--s3); padding:var(--s3);
    border:1px solid rgba(255,176,32,.28); border-radius:12px; font-size:13px; color:var(--mut)}
  .champline svg{width:15px; height:15px; color:var(--amber); flex:none}
  .champline b{color:var(--amber)}
  .mebar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:var(--s3);
    margin:var(--s3) calc(var(--s4) * -1) 0; padding:var(--s3) var(--s4); min-height:56px;
    background:rgba(7,8,11,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--hair); border-bottom:1px solid var(--hair); cursor:pointer}
  .mebar img{width:40px; height:40px; flex:none}
  .mebar .nm{font-size:16px; font-weight:600}
  .mebar .nm small{display:block; font-size:12px; color:var(--dim); font-weight:400; margin-top:1px}
  .mebar .go{margin-left:auto; font-size:13px; color:var(--amber); white-space:nowrap}
  /* пьедестал: три равные колонки, существа на общей линии, подписи не тянут блок */
  .podium{display:grid; grid-template-columns:1fr 1fr 1fr; align-items:end; gap:var(--s2); margin-top:var(--s6)}
  .pod{position:relative; min-width:0; text-align:center; cursor:pointer}
  .pod .beast{position:relative; display:flex; align-items:flex-end; justify-content:center;
    height:64px; transform-origin:50% 100%}
  .pod.p1 .beast{height:92px}                    /* запас сверху — короне нужно своё место */
  .pod img{width:48px; height:48px}
  .pod.p1 img{width:62px; height:62px; filter:drop-shadow(0 0 18px rgba(255,176,32,.4))}
  .pod .crown{position:absolute; top:-2px; left:50%; z-index:3; width:24px; height:24px;
    color:var(--amber); filter:drop-shadow(0 2px 7px rgba(0,0,0,.7))}
  .pod .base{position:relative; overflow:hidden; margin-top:var(--s2);
    border:1px solid var(--hair); border-bottom:none; border-radius:10px 10px 0 0;
    background:var(--ink2); padding:var(--s2) var(--s1); height:64px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
  .pod.p1 .base{border-color:rgba(255,176,32,.32); height:80px}

  /* ============================================================
     ЦЕРЕМОНИЯ ПЬЕДЕСТАЛА.
     Порядок как на награждении: сначала бронза, потом серебро, потом золото —
     задержки 0 / 140 / 280 мс строят ожидание, а не просто «всё выехало».
     Тумба приезжает снизу (решительный ease-out), существо садится следом
     с лёгким перелётом — вес приземления. Корона падает последней.
     В покое живёт ТОЛЬКО золото: медленный блик и дыхание свечения — статус
     передаётся движением, а не только размером. Серебро и бронза стоят тихо.
     ============================================================ */
  .pod .base{animation:podRise .52s var(--ease-out) both}
  @keyframes podRise{from{opacity:0; transform:translateY(26px)} to{opacity:1; transform:none}}

  /* ПРИЗЕМЛЕНИЕ. Четыре стадии, как учат в анимации веса:
     падение с ускорением (гравитация, ease-in — не «выплывает», а рушится),
     сплющивание в момент удара (squash), отскок вверх (stretch) и осадка.
     Существо тяжёлое — потому и тумбу вдавливает, и волну от удара пускает. */
  .pod .beast{animation:podLand .72s both}
  @keyframes podLand{
      0%{opacity:0; transform:translateY(-54px) scaleY(1.06) scaleX(.94);
         animation-timing-function:cubic-bezier(.55,0,.85,.35)}   /* разгон падения */
     10%{opacity:1}
     52%{transform:translateY(0) scaleY(1) scaleX(1);
         animation-timing-function:cubic-bezier(.3,0,.5,1)}
     64%{transform:translateY(0) scaleY(.78) scaleX(1.18)}        /* удар: сплющило */
     78%{transform:translateY(-9px) scaleY(1.08) scaleX(.95)}     /* отскок */
     90%{transform:translateY(0) scaleY(.96) scaleX(1.03)}
    100%{transform:none}}

  /* тумба принимает вес: вдавливается ровно в момент удара */
  .pod .base{position:relative}
  .pod .base>.hit{position:absolute; inset:0; pointer-events:none}
  .pod.p3 .base{animation-delay:0s}   .pod.p3 .beast{animation-delay:.18s}
  .pod.p2 .base{animation-delay:.14s} .pod.p2 .beast{animation-delay:.32s}
  .pod.p1 .base{animation-delay:.28s} .pod.p1 .beast{animation-delay:.46s}

  /* ударная волна из-под ног — тем заметнее, чем выше место */
  .pod .beast::before{content:''; position:absolute; left:50%; bottom:-4px; width:14px; height:14px;
    margin-left:-7px; border-radius:50%; border:2px solid rgba(255,176,32,.75);
    transform:scale(.2); opacity:0; animation:podShock .46s var(--ease-out) both}
  .pod.p3 .beast::before{animation-delay:.55s}
  .pod.p2 .beast::before{animation-delay:.69s}
  .pod.p1 .beast::before{animation-delay:.83s; border-color:rgba(255,176,32,.95); border-width:3px}
  @keyframes podShock{
      0%{opacity:0; transform:scale(.2)}
     15%{opacity:.95}
    100%{opacity:0; transform:scale(3.4)}}

  /* короткая тряска всей колонки в момент удара — вес чувствуется телом */
  .pod{animation:podJolt .16s linear both}
  .pod.p3{animation-delay:.55s} .pod.p2{animation-delay:.69s} .pod.p1{animation-delay:.83s}
  @keyframes podJolt{0%,100%{transform:none} 35%{transform:translateY(2px)} 70%{transform:translateY(-1px)}}
  .pod.p1{animation-name:podJoltHard}
  @keyframes podJoltHard{0%,100%{transform:none} 30%{transform:translateY(4px)} 65%{transform:translateY(-2px)}}

  /* корона садится после того, как чемпион утвердился на тумбе */
  .pod .crown{animation:crownDrop .44s var(--ease-back) 1.05s both}
  @keyframes crownDrop{from{opacity:0; transform:translateX(-50%) translateY(-22px) rotate(-14deg)}
                       to{opacity:1; transform:translateX(-50%) translateY(0) rotate(0)}}
  /* блик по тумбе чемпиона: короткий проход раз в 4.5 с */
  .pod.p1 .base::after{content:''; position:absolute; top:-30%; bottom:-30%; left:-40%; width:38%;
    background:linear-gradient(105deg, transparent, rgba(255,176,32,.30), transparent);
    transform:skewX(-18deg) translateX(-120px);
    animation:podShine 4.5s var(--ease-inout) 1.3s infinite}
  @keyframes podShine{0%{transform:skewX(-18deg) translateX(-120px)}
                      20%{transform:skewX(-18deg) translateX(220px)}
                      100%{transform:skewX(-18deg) translateX(220px)}}
  /* дыхание свечения под золотым существом */
  .pod.p1 .beast::after{content:''; position:absolute; left:50%; top:52%; width:74px; height:74px;
    margin:-37px 0 0 -37px; border-radius:50%; pointer-events:none; z-index:-1;
    background:radial-gradient(circle, rgba(255,176,32,.34), transparent 68%);
    animation:podGlow 3.6s var(--ease-inout) 1.1s infinite}
  @keyframes podGlow{0%,100%{opacity:.25; transform:scale(.92)} 50%{opacity:.55; transform:scale(1.06)}}
  .pod .n{max-width:100%; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pod .s{max-width:100%; font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lrow{display:flex; align-items:center; gap:var(--s3); padding:var(--s3) 0; min-height:72px;
    border-bottom:1px solid var(--hair); cursor:pointer}
  .lrow:last-child{border:none}
  .lrow .pos{width:28px; color:var(--dim); font-size:15px; text-align:right; flex:none}
  .lrow img{width:46px; height:46px; flex:none}
  .lrow .nm{font-size:17px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lrow .nm small{display:block; color:var(--dim); font-weight:400; font-size:13px; margin-top:2px;
    text-transform:none; letter-spacing:0}
  .lrow .nm .fireic{width:12px; height:12px; vertical-align:-2px; color:var(--amber)}
  .lrow .sc{margin-left:auto; text-align:right; flex:none}

  .lrow .duelbtn:active{transform:scale(.92)} .lrow .duelbtn svg{width:16px; height:16px}
  .lrow.meish{background:linear-gradient(90deg, rgba(255,176,32,.07), transparent);
    margin:0 calc(var(--s2) * -1); padding-left:var(--s2); padding-right:var(--s2); border-radius:10px}
  .morebtn{width:100%; margin-top:var(--s4); padding:var(--s4); border:1px solid var(--hair2);
    border-radius:12px; color:var(--mut); font-size:14px; min-height:52px}
  .morebtn:active{border-color:var(--amber)}

  /* ===== ШТОРКА ===== */
  #sheet{position:fixed; inset:0; z-index:90; display:none; align-items:flex-end; background:rgba(4,5,8,.66)}
  #sheet.on{display:flex}
  #sheet .panel{background:var(--ink2); border-top:1px solid var(--hair2);

    padding:var(--s2) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom));
    animation:slideup var(--t3) var(--ease-out); max-height:84dvh; overflow-y:auto}
  @keyframes slideup{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
  #sheet .grip{width:36px; height:4px; border-radius:99px; background:var(--hair2); margin:var(--s1) auto var(--s3)}
  .sh-title{font-family:var(--f-disp); font-weight:700; font-size:18px; margin:var(--s2) 0 var(--s1)}
  .optrow{display:flex; align-items:center; gap:var(--s3); padding:var(--s3) 2px; min-height:52px;
    border-bottom:1px solid var(--hair); cursor:pointer; font-size:15px}
  .optrow:last-child{border:none}
  .optrow .zn{color:var(--dim); font-size:13px; width:22px}

  .duel{display:flex; gap:var(--s3); margin-top:var(--s4); align-items:center}
  .duel .side{flex:1; text-align:center}
  .duel .side img{width:58px; height:58px; margin:0 auto}
  .duel .side .n{font-size:13px; font-weight:600; margin-top:var(--s2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .duel .vs{font-family:var(--f-disp); font-weight:900; color:var(--dim); font-size:14px}
  .dstat{margin-top:var(--s4)}
  .dstat .lbl{display:flex; justify-content:space-between; align-items:baseline;
    font-size:12px; color:var(--dim); margin:var(--s2) 0 var(--s1)}
  .dstat .lbl b{color:var(--fg); font-size:15px; font-weight:600}
  .dbar{display:flex; height:6px; border-radius:99px; overflow:hidden; background:rgba(244,241,232,.06); gap:2px}
  .dbar i{height:100%; transition:width .8s var(--ease-out); width:0}
  .dbar .l{background:var(--amber)} .dbar .r{background:var(--dim); margin-left:auto}
  .dverdict{text-align:center; font-family:var(--f-disp); font-weight:700; font-size:16px; margin-top:var(--s4); color:var(--amber)}

  .foot{color:var(--dim); font-size:12px; text-align:center; margin:var(--s6) 0 var(--s2); line-height:1.7}
  .err{border:1px solid rgba(255,82,82,.4); border-radius:12px; padding:var(--s4); font-size:14px; color:#ffb4b4; margin-top:var(--s4)}
  .textbtn{color:var(--dim); font-size:13px; padding:var(--s3); min-height:44px}

  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }

function tgHaptic(k){ try{ if(!TG||!TG.HapticFeedback) return;
  if(k==='win') TG.HapticFeedback.notificationOccurred('success');
  else if(k==='lose') TG.HapticFeedback.notificationOccurred('error');
  else TG.HapticFeedback.selectionChanged(); }catch(e){} }
function tgBack(){ try{ if(!TG||!TG.BackButton) return;
  const any=$('#replay').classList.contains('on')||$('#sheet').classList.contains('on')||$('#levelup').classList.contains('on');
  any?TG.BackButton.show():TG.BackButton.hide(); }catch(e){} }
function showSheet(){ $('#sheet').classList.add('on'); tgBack(); }

const BOT_URL='https://t.me/RBC_oracle_bot?start=verify';

  window.open(BOT_URL,'_blank','noopener'); }

    <button class="textbtn" style="width:100%;margin-top:var(--s2)" onclick="closeSheet()">позже</button>`;
  showSheet(); }
function tgAutoLogin(){ if(!TG||S.pid!=null||S.me) return;
  const u=TG.initDataUnsafe.user, bl=S.preds.board||[];
  const cands=[[u.first_name,u.last_name].filter(Boolean).join(' '), u.first_name, u.username].filter(Boolean);
  for(const c of cands){ const m=bl.filter(x=>x.name===c);
    if(m.length===1){ S.me=c; localStorage.setItem('oracle_me',c);
      if(m[0].pid!=null){ S.pid=m[0].pid; localStorage.setItem('oracle_pid',String(m[0].pid));

function sprite(name,glyph){ const key=name+(glyph||'');
  if(sprCache[key]) return sprCache[key];
  const g=SPRITES[name]; const cv=document.createElement('canvas'); cv.width=12; cv.height=12;
  const x=cv.getContext('2d');
  g.forEach((row,y)=>{ [...row].forEach((ch,xx)=>{ if(ch!=='.'&&PAL[ch]){ x.fillStyle=PAL[ch]; x.fillRect(xx,y,1,1); } }); });
  if(glyph&&GLYPHS[glyph]){ x.fillStyle=PAL.B;
    GLYPHS[glyph].forEach((row,y)=>{ [...row].forEach((ch,xx)=>{ if(ch!=='.') x.fillRect(4+xx,4+y,1,1); }); }); }
  return sprCache[key]=cv.toDataURL();
}

  return {...LEVELS[i], n:i+1, xp, next:LEVELS[i+1]||null}; }

const fmtWD=ts=>new Intl.DateTimeFormat('ru-RU',{...MSK,weekday:'short',day:'numeric',month:'short'}).format(new Date(ts));
function cd(ms){ if(ms<=0) return 'сейчас';
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  if(d>0) return `${d}д ${h}ч`; if(h>0) return `${h}ч ${String(m).padStart(2,'0')}м`; return `${m} мин`; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chartIdOf=c=>(c.link||'').split('/').pop();
function zoneOf(rr,p){ for(let i=0;i<rr.length;i++){const[lo,hi]=rr[i]; if((lo==null||p>=lo)&&(hi==null||p<hi)) return i;} return -1; }
const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function countTo(el,val,{dur=900,fmt=v=>Math.round(v).toLocaleString('ru-RU'),from=0}={}){
  if(reduced()||document.hidden){ el.textContent=fmt(val); return; }
  const t0=performance.now();
  (function f(t){ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=fmt(from+(val-from)*e); if(k<1) requestAnimationFrame(f); })(t0);
}
/* короткая метка зоны: "$62–64K" / "<$56K" / "$70–75" */
function zoneShort(rr,i,sym){ const[lo,hi]=rr[i];
  const f=v=>{ if(v>=1000){ const k=v/1000; return (k%1?k.toFixed(1):k)+'K'; } return String(v); };
  if(lo==null) return '<$'+f(hi); if(hi==null) return '>$'+f(lo);
  return '$'+f(lo)+'–'+f(hi); }

/* ============================== данные ============================== */
async function loadData(){
  const t=Date.now();
  const[p,c]=await Promise.all([
    fetch('predictions.json?t='+t).then(r=>r.json()),
    fetch('pred_charts.json?t='+t).then(r=>r.json())]);
  S.preds=p; S.charts=c.charts||{};
  let vw=0,vt=0;
  for(const ct of p.contests) if(ct.status==='resolved'&&ct.total>0&&ct.winner_option!=null){vw+=ct.votes[ct.winner_option]||0; vt+=ct.total;}
  S.crowd=vt?Math.round(100*vw/vt):null;
}
const contests=()=>(S.preds?.contests||[]).filter(c=>['open','voted','resolved'].includes(c.status));
const boardOf=n=>(S.preds?.board||[]).find(b=>b.name===n)||null;
/* Личность игрока — анонимный pid из predictions.json (его выдаёт бот, проверив
   telegram-айди). Имя — только запасной ключ для браузера: тёзок не различает
   и рвётся при переименовании. */
const boardByPid=p=>(S.preds?.board||[]).find(b=>b.pid===p)||null;
const meRow=()=>S.pid!=null?boardByPid(S.pid):boardOf(S.me);
const isMeRow=b=>!!b&&(S.pid!=null?b.pid===S.pid:(S.me!=null&&b.name===S.me));
const wonBy=(c,pid,name)=>(pid!=null&&c.winner_pids)?c.winner_pids.includes(pid)
                                                    :(c.winners||[]).includes(name);
const winsOf=(pid,name)=>contests().filter(c=>c.status==='resolved'&&wonBy(c,pid,name));
/* Мой голос в конкурсе. Пока идёт приём, бэкенд карту голосов не публикует
   (чтобы не подсказывать, за кем идти толпой) — тогда работает локальная отметка.
   После дедлайна приходит настоящий голос из опроса и заменяет её. */
function myVote(c){ const mr=meRow(), id=chartIdOf(c);
  if(mr&&mr.pid!=null&&c.votes_by_pid){ const v=c.votes_by_pid[String(mr.pid)];
    if(v!=null) return {zone:v, real:true}; }
  return S.bets[id]!=null?{zone:S.bets[id], real:false}:null; }
const myWins=n=>winsOf(null,n);
function readPid(){ const m=(location.hash||'').match(/pid=(\d+)/); if(m) return +m[1];
  const sp=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param;

/* ===== сезоны — как времена года (по МСК) ===== */
const SEASONS=[
  {nom:'зима', gen:'зимы',  range:'декабрь–февраль', ends:'28 февраля', instr:'этой зимой'},
  {nom:'весна',gen:'весны', range:'март–май',        ends:'31 мая',     instr:'этой весной'},
  {nom:'лето', gen:'лета',  range:'июнь–август',     ends:'31 августа', instr:'этим летом'},
  {nom:'осень',gen:'осени', range:'сентябрь–ноябрь', ends:'30 ноября',  instr:'этой осенью'},
];
const mskYM=d=>new Intl.DateTimeFormat('en-CA',{...MSK,year:'numeric',month:'2-digit'}).format(new Date(d));
function seasonOf(d){ const [y,m]=mskYM(d).split('-').map(Number);
  let idx,yy=y;
  if(m>=3&&m<=5) idx=1; else if(m>=6&&m<=8) idx=2; else if(m>=9&&m<=11) idx=3;
  else { idx=0; if(m===12) yy=y+1; }
  return {key:yy+'-'+idx, idx, year:yy}; }
const skIdx=key=>+key.split('-')[1];
const skYear=key=>+key.split('-')[0];
const seasonNom=key=>SEASONS[skIdx(key)].nom+(skYear(key)!==seasonOf(Date.now()).year?' '+skYear(key):'');
const seasonGen=key=>SEASONS[skIdx(key)].gen+(skYear(key)!==seasonOf(Date.now()).year?' '+skYear(key):'');
/* Победы сезона считаем по pid: тёзки — разные строки, переименование не рвёт. */
function seasonData(){ const m={};
  for(const c of contests()) if(c.status==='resolved'){
    const k=seasonOf(c.target_time).key; const bucket=m[k]=m[k]||{};
    const wp=c.winner_pids||[];
    (c.winners||[]).forEach((w,i)=>{ const pid=wp[i]!=null?wp[i]:null;
      const key=pid!=null?'p'+pid:'n'+w;
      const e=bucket[key]||(bucket[key]={pid,name:w,wins:0});
      e.wins++; e.name=(pid!=null&&boardByPid(pid)?boardByPid(pid).name:w); }); }
  return m; }
function seasonList(key){ const d=seasonData()[key]||{};
  return Object.values(d).sort((x,y)=>y.wins-x.wins||(x.name>y.name?1:-1)); }
function championsOf(key){ const l=seasonList(key); if(!l.length) return {names:[],wins:0,entries:[]};
  const mx=l[0].wins, top=l.filter(e=>e.wins===mx);
  return {names:top.map(e=>e.name),wins:mx,entries:top}; }
const SEASON_SLUG=['winter','spring','summer','autumn'];
const METALS=['gold','silver','bronze'];
/* Награды за завершённые сезоны: топ-3 по числу побед сезона.
   Медаль = сезон (зверь-мем) × металл (место). */
function seasonAwards(pid,name){
  const cur=seasonOf(Date.now()).key, out=[];
  for(const key of Object.keys(seasonData()).sort()){
    if(key>=cur) continue;
    const list=seasonList(key); if(!list.length) continue;
    const tiers=[...new Set(list.map(e=>e.wins))].slice(0,3);
    const idx=list.findIndex(e=>(pid!=null&&e.pid!=null)?e.pid===pid:e.name===name);
    if(idx<0) continue;
    const place=tiers.indexOf(list[idx].wins);
    if(place<0) continue;
    out.push({key, place, metal:METALS[place], slug:SEASON_SLUG[skIdx(key)], wins:list[idx].wins});
  }
  return out;
}
const seasonMedalImg=(a,size)=>`<img class="ai" src="${ART}season_${a.slug}_${a.metal}.png" width="${size}" height="${size}" alt="" onerror="this.onerror=null;this.classList.add('spr');this.src='${sprite('coin','?')}'">`;
function champTitles(pid,name){ const cur=seasonOf(Date.now()).key;
  return Object.keys(seasonData()).filter(k=>k<cur&&championsOf(k).entries.some(
    e=>pid!=null&&e.pid!=null?e.pid===pid:e.name===name)).sort(); }

/* ============================== звук ============================== */
let AC=null; const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function beep(f,dur=.09,type='sine',g=.05,when=0){ if(!S.sound) return; try{
  const a=ac(),o=a.createOscillator(),gn=a.createGain();
  o.type=type; o.frequency.value=f; o.connect(gn); gn.connect(a.destination);
  const t=a.currentTime+when; gn.gain.setValueAtTime(0,t);
  gn.gain.linearRampToValueAtTime(g,t+.01); gn.gain.exponentialRampToValueAtTime(1e-4,t+dur);
  o.start(t); o.stop(t+dur+.05);}catch(e){} }
const sTick=()=>{tgHaptic('tick'); beep(880,.05,'square',.018);};
const sWin=()=>{tgHaptic('win'); [523,659,784,1047].forEach((f,i)=>beep(f,.22,'triangle',.06,i*.09)); navigator.vibrate&&navigator.vibrate([40,60,40]);};
const sThud=()=>{tgHaptic('lose'); beep(130,.25,'sine',.09); beep(98,.3,'sine',.07,.05);};

/* ============================== лестница ============================== */
function drawLadder(cv,ch,opt={}){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=opt.h||(ch.ranges.length*44+26);
  cv.style.height=H+'px';
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);}
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  const fs=document.body.classList.contains('rec')?1.35:1;      // запись ролика: мелочь крупнее
  const L=4,Rt=W-4,T=6,Bm=H-18*fs, rr=ch.ranges, ser=ch.series||[];
  let lo=Infinity,hi=-Infinity;
  for(const[,p]of ser){lo=Math.min(lo,p);hi=Math.max(hi,p);}
  for(const[a,b]of rr){ if(a!=null){lo=Math.min(lo,a);hi=Math.max(hi,a);} if(b!=null){lo=Math.min(lo,b);hi=Math.max(hi,b);} }
  if(!isFinite(lo)){lo=0;hi=1;}
  const pad=(hi-lo)*.04||1; lo-=pad; hi+=pad;
  const py=p=>Bm-(p-lo)/(hi-lo)*(Bm-T);
  const t0=+new Date(ch.posted), t1=+new Date(ch.target);
  const px=t=>L+(t-t0)/(t1-t0)*(Rt-L);
  const n=Math.max(1,Math.round((opt.progress==null?1:opt.progress)*ser.length));
  const cur=ser[Math.min(n,ser.length)-1];
  const curZone=cur?zoneOf(rr,cur[1]):-1;
  const maxV=opt.votes?Math.max(1,...opt.votes):1;

  /* зоны: заливки-подсветки */
  for(let i=0;i<rr.length;i++){
    const[a,b]=rr[i], y1=py(b==null?hi:b), y2=py(a==null?lo:a);
    if(i===opt.winnerZone){ x.fillStyle='rgba(44,224,139,.10)'; x.fillRect(L,y1,Rt-L,y2-y1); }
    else if(i===curZone&&opt.live){ x.fillStyle='rgba(255,176,32,.05)'; x.fillRect(L,y1,Rt-L,y2-y1); }
    if(i===opt.myZone){ x.fillStyle='rgba(255,176,32,.045)'; x.fillRect(L,y1,Rt-L,y2-y1);
      x.fillStyle='#FFB020'; x.fillRect(L,y1,2,y2-y1); }
  }
  /* дни недели */
  x.font=`500 ${10*fs}px "IBM Plex Mono",monospace`; x.textAlign='center'; x.textBaseline='alphabetic';
  for(let t=Math.ceil(t0/864e5)*864e5;t<t1;t+=864e5){
    const xx=px(t); if(xx<L+16||xx>Rt-16) continue;
    x.fillStyle='rgba(86,93,110,.9)';
    x.fillText(new Intl.DateTimeFormat('ru-RU',{...MSK,weekday:'short'}).format(new Date(t)).toUpperCase(),xx,H-6);
  }
  x.textAlign='left';
  /* границы зон + подписи */
  for(let i=0;i<rr.length;i++){
    const[a,b]=rr[i], y1=py(b==null?hi:b), y2=py(a==null?lo:a), ym=(y1+y2)/2;
    if(fs>1){ if(a!=null){ x.strokeStyle='rgba(138,143,156,.28)'; x.lineWidth=1;   // запись: линии зон = рельсы тоннеля в конце выезда (recFlight)
        x.beginPath(); x.moveTo(L,y2); x.lineTo(Rt,y2); x.stroke(); } }
    else { x.strokeStyle='rgba(244,241,232,.07)'; x.lineWidth=1;
      x.beginPath(); x.moveTo(L,y2+.5); x.lineTo(Rt,y2+.5); x.stroke(); }
    const lab=zoneShort(rr,i,ch.symbol);
    x.font=`600 ${11*fs}px "IBM Plex Mono",monospace`; x.textBaseline='middle';
    x.fillStyle= i===opt.winnerZone?'#2CE08B': (i===curZone&&opt.live)?'#FFB020': i===opt.myZone?'rgba(255,176,32,.85)':'rgba(139,147,167,.55)';
    x.fillText(lab,L+7,ym);
    if(i===opt.myZone){ x.font=`600 ${9.5*fs}px "IBM Plex Mono",monospace`;
      x.fillText('ТЫ',L+7+x.measureText(lab).width+18,ym); x.font=`600 ${11*fs}px "IBM Plex Mono",monospace`; }
    if(opt.votes&&opt.votes[i]>0){
      const w=8+40*(opt.votes[i]/maxV), bx=Rt-8-w;
      x.fillStyle= i===opt.winnerZone?'rgba(44,224,139,.7)':'rgba(139,147,167,.35)';
      x.fillRect(bx,ym-1.5,w,3);
      x.fillStyle='rgba(139,147,167,.8)'; x.font=`500 ${10.5*fs}px "IBM Plex Mono",monospace`;
      x.textAlign='right'; x.fillText(opt.votes[i],bx-5,ym); x.textAlign='left';
    }
  }
  /* запись: янтарный коридор текущей зоны — продолжение янтарных рельсов тоннеля */
  if(fs>1&&opt.live&&curZone>=0){ const[a,b]=rr[curZone]; x.strokeStyle='rgba(255,176,32,.55)'; x.lineWidth=1.5;
    for(const v of [a,b]) if(v!=null){ const yy=py(v); x.beginPath(); x.moveTo(L,yy); x.lineTo(Rt,yy); x.stroke(); } }
  /* дедлайн */
  if(opt.deadline){ const dx=px(+new Date(opt.deadline));
    if(dx>L&&dx<Rt){ x.fillStyle='rgba(255,82,82,.8)'; x.fillRect(dx-1,Bm-6,2,6); } }
  /* линия цены */
  if(n>1){ x.strokeStyle='rgba(255,176,32,.9)'; x.lineWidth=1.6*fs; x.lineJoin='round';
    x.save(); x.shadowColor='rgba(255,176,32,.35)'; x.shadowBlur=6; x.beginPath();
    for(let i=0;i<n;i++){const[t,p]=ser[i]; const X=px(t),Y=py(p); i?x.lineTo(X,Y):x.moveTo(X,Y);}
    x.stroke(); x.restore(); }
  /* комета */
  if(cur){ const X=px(cur[0]),Y=py(cur[1]);
    const pulse=opt.live?(0.7+0.3*Math.sin(Date.now()/420)):1;
    x.save(); x.shadowColor='rgba(255,176,32,.9)'; x.shadowBlur=12*pulse;
    const cs=3*fs; x.fillStyle='#FFB020'; x.fillRect(X-cs,Y-cs,2*cs,2*cs); x.restore();
    x.fillStyle='#F2EFE6'; x.fillRect(X-1,Y-1,2,2);
  }
  /* точка финиша */
  if(opt.winnerPrice!=null&&(opt.progress==null||opt.progress>=1)){
    const Y=py(opt.winnerPrice);
    x.save(); x.shadowColor='rgba(44,224,139,.95)'; x.shadowBlur=14;
    x.fillStyle='#2CE08B'; x.fillRect(Rt-8,Y-4,8,8); x.restore();
  }
  return {cur,curZone,py,px,lo,hi,T,Bm,L,Rt};
}
/* конфетти направленным веером из точки */
function confettiBurst(cv,fx,fy,dur=2200){
  if(reduced()) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#FFB020','#2CE08B','#F7D96B','#F2EFE6'];
  const ps=Array.from({length:90},()=>{ const a=Math.PI*(0.75+Math.random()*0.85); const v=2+Math.random()*4.5;
    return {x:fx,y:fy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2.2,s:2+Math.random()*3,
      c:cols[Math.random()*cols.length|0]}; });
  const t0=performance.now();
  (function f(t){ const k=(t-t0)/dur; x.clearRect(0,0,W,H); if(k>1) return;
    for(const p of ps){ p.x+=p.vx; p.y+=p.vy; p.vy+=.09;
      x.globalAlpha=Math.max(0,1-k*1.15); x.fillStyle=p.c; x.fillRect(p.x,p.y,p.s,p.s); }
    x.globalAlpha=1; requestAnimationFrame(f); })(t0);
}
function flashRing(cv,fx,fy){
  if(reduced()) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth,H=cv.clientHeight;
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const t0=performance.now();
  (function f(t){ const k=(t-t0)/380; if(k>1) return;
    x.strokeStyle=`rgba(242,239,230,${(1-k)*.8})`; x.lineWidth=2.5-k*2;
    x.beginPath(); x.arc(fx,fy,4+k*46,0,7); x.stroke();
    requestAnimationFrame(f); })(t0);
}

const pickLiveContest=()=>{ const cs=contests();
  return cs.find(c=>c.status==='open')||cs.find(c=>c.status==='voted')||cs[0]||null; };
function renderLive(){
  const v=$('#v-live'); const c=pickLiveContest();
  if(!c){ v.innerHTML='<div class="err">Нет данных конкурсов.</div>'; return; }
  const id=chartIdOf(c), ch=S.charts[id], now=Date.now();
  const dl=+new Date(c.deadline), tg=+new Date(c.target_time);
  const open=c.status==='open'&&now<dl, resolved=c.status==='resolved';
  const mv=myVote(c), myZone=mv?mv.zone:null;
  const cur=ch?.series?.length?ch.series[ch.series.length-1]:null;
  const curZone=cur&&ch?zoneOf(ch.ranges,cur[1]):-1;

  if(resolved){
    const wn=c.winners||[]; const mr=meRow(); const meWon=!!mr&&wonBy(c,mr.pid,mr.name);
    v.innerHTML=`
      <div class="ticker"><span class="price" style="color:var(--green)">${ch?zoneShort(ch.ranges,c.winner_option):''}</span>
        <span class="asset">${esc(symName(ch?.symbol))} · ФИНИШ<br>${fmtD(tg)}</span></div>
      <div class="statusline">итог ${fmtP(c.winner_price)} · новый конкурс — обычно в среду</div>
      <div class="bigstate ${meWon?'win':''}">${meWon?'Ты угадал. Красиво.':wn.length?'Угадали '+wn.length+'. Рынок дал себя прочитать.':'Не угадал никто — рынок победил всех.'}</div>
      ${wn.length?`<div class="wgrid" style="margin-top:8px">${wn.slice(0,8).map((w,i)=>`<span class="wtag ${isWinnerMe(c,i)?'meish':''}" style="--i:${i}">${beastImg(lvlOfWinner(c,i,w),20)} ${esc(winnerName(c,i,w))}</span>`).join('')}${wn.length>8?`<span class="wtag" style="--i:8">+${wn.length-8}</span>`:''}</div>`:''}
      <button class="cta" style="margin-top:var(--s6)" onclick="openReplay('${id}')">${icon('flag')} Смотреть реплей финиша</button>
      ${finList()}`;
    if(wn.length&&localStorage.getItem('oracle_fin_seen')!==id&&!document.hidden){
      localStorage.setItem('oracle_fin_seen',id);
      const cv=document.createElement('canvas');
      cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:60';
      document.body.appendChild(cv);
      confettiBurst(cv,cv.clientWidth/2,cv.clientHeight*0.22);
      if(meWon) sWin();
      setTimeout(()=>cv.remove(),2600);
    }
    return;
  }

  let state='', stateCls='';
  if(!open&&myZone!=null&&curZone===myZone){ state='Цена в твоей зоне. Не дыши.'; stateCls='win'; }
  else if(!open&&myZone!=null&&curZone>=0){
    const d=Math.abs(curZone-myZone);
    const edge=myZone>curZone?ch.ranges[myZone][0]:ch.ranges[myZone][1];
    let dist=edge!=null&&cur?Math.abs(cur[1]-edge):null;
    if(dist!=null&&dist>=100) dist=Math.round(dist);
    state=d===1?`До твоей зоны ${dist!=null?fmtP(dist):'один шаг'}.`:`Цена в ${d} зонах. Молись на волатильность.`;
    stateCls='warn';
  }

  v.innerHTML=`
    <div class="ticker">
      <span class="price" id="tprice">—</span>
      <span class="asset">${esc(symName(ch?.symbol))}/USDT · Binance</span>
    </div>
    <div class="statusline"><b>${cd((open?dl:tg)-now)}</b> ${open?`до конца приёма · финиш ${fmtWD(tg)} 12:00`:`до финиша ${fmtWD(tg)} 12:00`}</div>
    ${state?`<div class="bigstate ${stateCls}">${state}</div>`:''}
    <div class="ladderwrap"><canvas id="lcanvas" class="ladder"></canvas></div>
    <div class="undernote" id="ifnow"></div>
    ${open?`<a class="cta" style="margin-top:var(--s4)" href="${esc(c.link)}" target="_blank" rel="noopener" id="votecta">${icon('zap')} Голосовать в Telegram</a>
      ${myZone!=null
        ? `<div class="marknote">${icon('check')} твой голос: <b>${zoneShort(ch.ranges,myZone)}</b><small>${mv.real?'из опроса':'изменить нельзя'}</small></div>`
        : `<div class="undernote" style="text-align:center">проголосовал? отметь свою зону на лестнице</div>`}`
      :(myZone==null?`<div class="undernote" style="margin-top:var(--s3)">Голосовал? Коснись своей зоны на лестнице — эфир станет личным.</div>`:'')}
    ${finList()}
  `;
  const tp=$('#tprice'); if(cur) countTo(tp,cur[1],{fmt:v=>fmtP(v),from:cur[1]*.985}); else tp.textContent='—';
  const cta=$('#votecta'); if(cta) cta.addEventListener('click',()=>{ S.voteTs=Date.now(); localStorage.setItem('oracle_votets',S.voteTs); });

  const cv=$('#lcanvas');
  if(ch){
    const paint=()=>{ if(!document.body.contains(cv)) return;
      drawLadder(cv,ch,{live:true,votes:c.votes,labels:c.options,myZone,deadline:c.deadline});
      const el=$('#ifnow');
      if(el){ if(cur&&curZone>=0){
        const vt=c.votes?.[curZone]||0;
        el.innerHTML=`Финиш сейчас → <b>${zoneShort(ch.ranges,curZone)}</b>${vt?` · угадали бы ${vt}`:''}${myZone!=null&&curZone===myZone?' · <b style="color:var(--green)">ты в их числе</b>':''}`;
      } else el.textContent='ждём первые свечи…'; } };
    paint();
    clearInterval(S.liveTimer); S.liveTimer=setInterval(paint,1300);
    /* Голос в опросе изменить нельзя — отметка тоже ставится один раз:
       сначала подтверждение (защита от промаха), потом лестница только для чтения. */
    cv.onclick=e=>{ const r=cv.getBoundingClientRect();
      const cur=myVote(c); if(cur) return showVoteLocked(ch,cur.zone,cur.real);
      const info=drawLadder(cv,ch,{votes:c.votes,myZone:S.bets[id]});
      const p=info.lo+(1-((e.clientY-r.top)-info.T)/(info.Bm-info.T))*(info.hi-info.lo);
      const z=zoneOf(ch.ranges,p); if(z<0) return;
      confirmVote(id,ch,z); };
  }
}

let RP={raf:0,skip:false};
const repH=()=>document.body.classList.contains('rec')?Math.min(innerHeight*.63,620):Math.min(innerHeight*.56,520);
function timeRemap(u){ // фазы: разгон → полёт → слоу-мо у финиша
  if(u<.1){ const k=u/.1; return .06*k*k; }
  if(u<.75){ return .06+.82*((u-.1)/.65); }
  const k=(u-.75)/.25; return .88+.12*(1-Math.pow(1-k,3));
}
function openReplay(id){
  const c=contests().find(x=>chartIdOf(x)===id); const ch=S.charts[id];
  if(!c||!ch) return;
  RP={raf:0,skip:false,c,ch,id};
  $('#replay').classList.add('on'); tgBack(); $('#resheet').innerHTML='';
  document.body.style.overflow='hidden';
  if(reduced()){ finishReplay(true); return; }
  const cv=$('#rcanvas'), DUR=6000; let t0=0,lastZone=-1;
  const step=t=>{ if(!$('#replay').classList.contains('on')) return;
    if(!t0) t0=t;
    let u=Math.min(1,(t-t0)/DUR); if(RP.skip) u=1;
    const p=timeRemap(u);
    const info=drawLadder(cv,ch,{progress:p,votes:c.votes,myZone:(myVote(c)||{}).zone,
      deadline:c.deadline,h:repH(),live:document.body.classList.contains('rec')});
    if(window.__recCam) window.__recCam(info,u);     // запись ролика: 3D-камера бежит за точкой (recFlight)
    if(info.cur){ $('#rclock').textContent=fmtDT(info.cur[0]);
      if(info.curZone!==lastZone&&lastZone!==-1) sTick(); lastZone=info.curZone; }
    if(u<1) RP.raf=requestAnimationFrame(step); else finishReplay();
  };
  RP.raf=requestAnimationFrame(step);
  $('#skipbtn').onclick=()=>{RP.skip=true};
}
function finishReplay(instant){
  const {c,ch,id}=RP;
  const H=repH();

    deadline:c.deadline,winnerZone:c.winner_option,winnerPrice:c.winner_price,h:H});

    ${mv&&!betWon?`<div class="r-sub">твой голос ${zoneShort(ch.ranges,mv.zone)} — мимо. В среду отыграемся.</div>`:''}
    ${wn.length?`<div class="k" style="margin-top:16px">угадали ${wn.length}</div>
      <div class="wgrid">${wn.map((w,i)=>`<span class="wtag ${isWinnerMe(c,i)?'meish':''}" style="--i:${i}" ${winnerPid(c,i)!=null?`onclick="openPlayerPid(${winnerPid(c,i)})"`:''}>${beastImg(lvlOfWinner(c,i,w),20)} ${esc(winnerName(c,i,w))}</span>`).join('')}</div>`
      :'<div class="r-sub" style="margin-top:14px">не угадал никто — рынок победил всех</div>'}
    <button class="cta ghost" style="margin-top:20px" onclick="closeReplay()">закрыть</button>`;
  const pv=$('#rpricev'); if(!instant&&pv) countTo(pv,c.winner_price,{fmt:v=>fmtP(v),from:c.winner_price*.97,dur:700});
  /* запись ролика: punch-зум сцены и вспышка на финише, через 1.3 с — ход сценарию runRecording */

    setTimeout(()=>{ const r=window.__recResolve; window.__recResolve=null;

/* ===== Запись ролика для поста (render_replay.py): #replay=<msg_id>&rec=1[&ups=<json>]
   Сценарий: интро (о чём ролик) → реплей гонки и финиш → новые звания крупно → призыв голосовать.
   ups — список {name, n} (новый уровень) считает бэкенд (predictions._post_result). ===== */
function readReplayParam(){ const m=(location.hash||'').match(/replay=(\d+)/); return m&&/rec=1/.test(location.hash)?m[1]:null; }
function readUpsParam(){ try{ const m=(location.hash||'').match(/ups=([^&]+)/); const v=m?JSON.parse(decodeURIComponent(m[1])):[];
  return Array.isArray(v)?v.filter(u=>u&&u.name):[]; }catch(e){ return []; } }
const recSleep=ms=>new Promise(r=>setTimeout(r,ms));
/* показать карточку новым листом: въезд снизу, прежний лист одновременно уезжает вверх («пуш»);
   slide=false — мгновенно. Скрыть — жёсткий cut */
function recShow(html,{slide=true,jolt=false}={}){ const box=$('#reccard'); box.classList.remove('jolt'); box.style.display='block';
  const old=[...box.querySelectorAll('.pg')];
  const pg=document.createElement('div'); pg.className=slide?'pg':'pg cut on'; pg.innerHTML=html; box.appendChild(pg);
  if(slide){ void pg.offsetWidth; pg.classList.add('on'); old.forEach(o=>{ o.classList.remove('cut'); o.classList.add('out'); });
    setTimeout(()=>old.forEach(o=>o.remove()),420); }
  else old.forEach(o=>o.remove());
  if(jolt){ void box.offsetWidth; box.classList.add('jolt'); } }
function recHide(){ const box=$('#reccard'); box.innerHTML=''; box.classList.remove('jolt'); box.style.display='none'; }
const plRu=(n,[one,few,many])=>{ const a=Math.abs(n)%100, b=a%10; return a>10&&a<20?many:b===1?one:b>=2&&b<=4?few:many; };
function recFlash(){ const f=$('#recflash'); if(!f) return; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
/* сплошная жёлтая заливка: on — мгновенно; off — схлопывается кругом в точку цены
   (она в кадре тоннеля стоит в 50%/42%), будто жёлтое и было этой точкой */
function recCover(on){ const el=$('#reccover'); if(!el) return;
  if(on){ el.style.transition='none'; el.style.display='block'; el.style.opacity='1'; el.style.clipPath='circle(120% at 50% 42%)'; void el.offsetWidth; }
  else { /* схлопывание кругом через rAF (CSS-переход clip-path в записи не отработал): ease-in — чуть держит жёлтое, потом резко в точку */
    const t0=performance.now(), ms=460;
    (function f(t){ const k=Math.min(1,(t-t0)/ms), e=k*k*k; el.style.clipPath=`circle(${(120*(1-e)).toFixed(2)}% at 50% 42%)`;
      if(k<1) requestAnimationFrame(f); else { el.style.display='none'; el.style.opacity='0'; el.style.clipPath=''; el.style.transition=''; } })(t0); } }
/* 3D-пролёт за точкой цены и сквозной проезд камеры в график (холст #rec3d поверх реплея).
   Мир: x — поперёк тоннеля, y — цена (высота), z — время в часах от камеры погони.
   Камера одна на всю сцену и всегда смотрит на точку. Её параметры: рысканье θ и тангаж φ,
   плечо d0, масштаб g (px на единицу мира в плоскости точки), долли-зум λ (1 — перспектива,
   0 — орто: камера отъехала в бесконечность, а фокус вырос так же, плоскость точки не меняет
   масштаба), сжатие оси времени σ и место точки на экране (sx, sy). Проекция однородная:
   экран = (sx + g·xc/w, sy − g·yc/w), w = 1 + λ·zc/d0 — прямые остаются прямыми в любой момент.
   Погоня: θ≈+11° (камера справа), φ≈23°, λ=1. Выезд (доли гонки FROM→TO): камера облетает точку вправо-вбок
   (θ→90°, справа — иначе время шло бы справа налево), стенки тоннеля сходятся в плоскость
   графика, камера отъезжает и сплющивает перспективу (λ→0), ось времени сжимается, а масштаб
   и место точки приходят ровно в раскладку 2D-лестницы (info.px/py + место холста #rcanvas).
   Рельсы тянутся на всё время конкурса, поэтому в конце они и есть линии зон лестницы,
   путь — её линия цены, точка — её комета. Последние 10% выезда холст совпадает с лестницей
   линия в линию и тает: проявляются только подписи и голоса лестницы, наложения сцен нет. */
function recFlight(ch,FROM=0.3,TO=0.72){
  const cv=$('#rec3d'), lc=$('#rcanvas'); let finished=false;
  const finish=()=>{ finished=true; if(cv){ cv.style.display='none'; cv.style.opacity='1'; } };
  if(!cv||!lc) return {draw(){}};
  const dpr=window.devicePixelRatio||1, W=innerWidth, H=innerHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.display='block'; cv.style.opacity='1'; cv.style.transition='';
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const ser=ch.series||[], rr=ch.ranges||[];
  const bounds=[...new Set(rr.flatMap(([lo,hi])=>[lo,hi]).filter(v=>v!=null))].sort((a,b)=>a-b);
  if(bounds.length<2){ finish(); return {draw(){}}; }                    // не из чего строить тоннель — сразу лестница
  const lo=bounds[0], hi=bounds[bounds.length-1], span=hi-lo;
  const step=[0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000,10000].find(s=>span/s<=14)||10000;
  const minor=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) if(!bounds.some(b=>Math.abs(b-v)<1e-9)) minor.push(v);
  /* CAMX небольшой: при большом смещении камера «смотрит» вбок и дальняя стенка уходит за край кадра.
     Камера справа от точки (CAMX>0): облёт тоже вправо, поэтому она не проходит через плоскость графика
     (при старте слева путь на миг схлопывался в вертикаль и переворачивался).
     CAMY выше точки даёт наклон вниз — путь выходит из низа кадра, рельсы сходятся вверху */
  const HOUR=3600e3, LEAD=8, FAR=60, NEAR=0.5, HW=13, TH=40, CAMX=1.6, CAMY=3.4, NEARC=0.3;   // HW узкий — обе стенки в кадре
  const f=W*0.9, cx=W/2, cy=H*0.42, TAU=26/f;                            // TAU — толщина «трубки» пути в мире
  const t0=+new Date(ch.posted), t1=+new Date(ch.target);
  const Y=p=>(p-lo)/span*TH-TH/2;
  const wdF=new Intl.DateTimeFormat('ru-RU',{...MSK,weekday:'short'}), dayName=t=>wdF.format(new Date(t)).toUpperCase();
  const sst=(a,b,v)=>{ const k=Math.min(1,Math.max(0,(v-a)/(b-a))); return k*k*(3-2*k); };
  const mix=(a,b,k)=>a+(b-a)*k;
  const fog=z=>z<=0?1:Math.pow(Math.max(0,1-z/FAR),1.6);                 // туман глубины: даль гаснет
  let ysm=null, cam=null, rect=null;
  /* мировая точка → однородные экранные координаты [g·xc, g·yc, w] (линейны по миру — обрезку
     по ближней плоскости можно делать прямо в них) */
  const toScr=P=>{ const {T,R,U,F,d0,lam,g,sig}=cam, vx=P[0]-T[0], vy=P[1]-T[1], vz=(P[2]-T[2])*sig;
    return [g*(vx*R[0]+vz*R[2]), g*(vx*U[0]+vy*U[1]+vz*U[2]), 1+lam*(vx*F[0]+vy*F[1]+vz*F[2])/d0]; };
  const scr=P=>{ const A=toScr(P); return A[2]<=cam.wmin?null:[cam.sx+A[0]/A[2], cam.sy-A[1]/A[2], A[2]]; };
  function line(a,b,w,alpha,color){
    let A=toScr(a), B=toScr(b); const WM=cam.wmin;
    if(A[2]<=WM&&B[2]<=WM) return;
    if(A[2]<=WM||B[2]<=WM){ const [P,Q]=A[2]<=WM?[A,B]:[B,A]; const k=(WM-P[2])/(Q[2]-P[2]);   // обрезка по ближней плоскости
      const M=[P[0]+(Q[0]-P[0])*k, P[1]+(Q[1]-P[1])*k, WM]; if(A[2]<=WM) A=M; else B=M; }
    x.strokeStyle=color; x.globalAlpha=alpha; x.lineWidth=w; x.beginPath();
    x.moveTo(cam.sx+A[0]/A[2], cam.sy-A[1]/A[2]); x.lineTo(cam.sx+B[0]/B[2], cam.sy-B[1]/B[2]); x.stroke(); }
  function setCamera(info,tcur,pcur,k){
    const now=performance.now(), aO=sst(0,0.7,k), aZ=sst(0.08,0.9,k), lam=1-sst(0.22,0.86,k);
    const swayK=1-aO, sway=0.55*Math.sin(now/650)*swayK;               // лёгкое покачивание погони, на выезде стихает
    const T=[0,Y(pcur),LEAD], C=[CAMX+sway, ysm+CAMY+0.25*Math.sin(now/410)*swayK, 0];
    const dx=T[0]-C[0], dy=T[1]-C[1], dz=T[2]-C[2], d0=Math.hypot(dx,dy,dz);
    const th=mix(Math.atan2(-dx,dz),Math.PI/2,aO), ph=mix(Math.asin(-dy/d0),0,aO);
    const F=[-Math.sin(th)*Math.cos(ph), -Math.sin(ph), Math.cos(th)*Math.cos(ph)], R=[Math.cos(th),0,Math.sin(th)];
    const U=[F[1]*R[2], F[2]*R[0]-F[0]*R[2], -F[1]*R[0]];                  // up = forward × right
    /* цель выезда — раскладка лестницы: px на час по времени, px на доллар по цене, место кометы */
    if(!rect) rect=lc.getBoundingClientRect();
    const kxh=info.px(tcur+HOUR)-info.px(tcur), gEnd=(info.py(lo)-info.py(hi))/TH;   // px на час и px на единицу высоты мира
    const g0=f/d0, g=g0*Math.pow(gEnd/g0,aZ), sig=Math.pow(kxh/gEnd,aZ);
    cam={T,R,U,F,d0,lam,g,sig,aO,aZ, wmin:Math.max(1e-4,NEARC*lam/d0),
      sx:mix(cx,rect.left+info.px(tcur),aZ), sy:mix(cy,rect.top+info.py(pcur),aZ)};
  }
  function draw(info,u=0){
    if(finished||!info||!info.cur) return;
    const tcur=info.cur[0], pcur=info.cur[1], k=Math.min(1,Math.max(0,(u-FROM)/(TO-FROM)));
    if(k>=1){ finish(); return; }                                        // дальше та же картинка — уже сама лестница
    ysm=ysm==null?Y(pcur):ysm+(Y(pcur)-ysm)*0.12;
    setCamera(info,tcur,pcur,k);
    const {aO,aZ}=cam, aS=sst(0.3,0.9,k), fogMix=sst(0.15,0.75,k);
    const hw=HW*(1-sst(0.1,0.75,k));                                     // стенки сходятся в плоскость графика
    const wallA=sd=>sd>0?1-sst(0,0.45,k):1, gateA=1-sst(0,0.5,k);        // ближняя (правая, sd=+1) стенка и ворота гаснут до пролёта сквозь них;
                                                                         // стенку различаем по стороне, не по знаку x — в конце обе в x=0
    const zcam=tcur-LEAD*HOUR, Z=t=>(t-zcam)/HOUR, za=Z(t0), zb=Z(t1);
    cv.style.opacity=String(1-sst(0.9,1,k));                             // совпало с лестницей линия в линию — тает
    x.globalAlpha=1; x.shadowBlur=0; x.fillStyle='#07080B'; x.fillRect(0,0,W,H);
    x.lineCap='round'; x.lineJoin='round';
    /* рельс: в погоне — от камеры до FAR, как раньше; к концу выезда — ровно на время конкурса
       (от публикации до цели), как линии зон лестницы. Кусок позади камеры, 8 кусков до FAR (туман), хвост */
    const zs=mix(Math.min(za,NEAR),za,aZ), ze=mix(Math.max(zb,FAR),zb,aZ);
    const cuts=[zs]; for(let s2=0;s2<=8;s2++){ const z=FAR*s2/8; if(z>zs&&z<ze) cuts.push(z); } cuts.push(ze);
    function rail(xw,yv,w,alpha,color){ if(alpha<0.01) return;
      for(let i=1;i<cuts.length;i++){ const z0=cuts[i-1], z1=cuts[i], g=mix(fog((z0+z1)/2),1,fogMix);
        if(g>0.02) line([xw,yv,z0],[xw,yv,z1],w,alpha*g,color); } }
    const zc=zoneOf(rr,pcur), zr=zc>=0?rr[zc]:null;                      // зона, где сейчас цена: её рельсы янтарные
    const minA=0.16*(1-sst(0.2,0.7,k));
    if(minA>0.01) for(const m of minor) for(const sd of [-1,1]) rail(sd*hw,Y(m),1,minA*wallA(sd),'#8A8F9C');
    for(const b of bounds){ const hot=!!zr&&(b===zr[0]||b===zr[1]);
      for(const sd of [-1,1]) rail(sd*hw,Y(b),hot?mix(2.4,1.5,aS):mix(1.8,1,aS),(hot?mix(0.9,0.55,aS):mix(0.6,0.28,aS))*wallA(sd),hot?'#FFB020':'#8A8F9C'); }
    if(gateA>0.01){
      const t6=Math.ceil(zcam/(6*HOUR))*6*HOUR;                         // перекладины времени каждые 6 ч
      for(let t=t6; Z(t)<FAR; t+=6*HOUR){ const z=Z(t); if(z<NEAR) continue; const a=0.32*fog(z)*gateA;
        if(a>0.01) for(const b of bounds) line([-hw,Y(b),z],[hw,Y(b),z],1.1,a,'#8A8F9C'); }
      /* ворота суток (полночь МСК): рамка во всю высоту и день недели над ней — пролетаем дни */
      const DAY=24*HOUR, OFF=3*HOUR;
      for(let t=Math.ceil((zcam+OFF)/DAY)*DAY-OFF; Z(t)<FAR; t+=DAY){ const z=Z(t); if(z<NEAR) continue;
        const a=0.75*fog(z)*gateA; if(a<0.02) continue;
        for(const sx of [-hw,hw]) line([sx,Y(lo),z],[sx,Y(hi),z],2,a,'#8A8F9C');
        line([-hw,Y(hi),z],[hw,Y(hi),z],2,a,'#8A8F9C'); line([-hw,Y(lo),z],[hw,Y(lo),z],2,a,'#8A8F9C');
        const Lb=scr([0,Y(hi)+1.2,z]); if(Lb){ const fz=Math.max(11,Math.min(40,1.3*cam.g/Lb[2]));   // g/w — px на единицу мира в этой точке
          x.globalAlpha=Math.min(1,a*1.3); x.fillStyle='#C9CEDA'; x.font=`900 ${fz.toFixed(1)}px Unbounded, sans-serif`; x.textAlign='center';
          x.fillText(dayName(t),Lb[0],Lb[1]); } } }
    /* путь: вся пройденная история (позади камеры погони её срезает ближняя плоскость, на выезде
       она открывается слева). Толщина — по экранному масштабу в точке пути: в погоне толстая трубка
       у камеры, в конце ровно линия цены лестницы. Куски одной толщины рисуются одним штрихом */
    const wEnd=1.6*1.35, pa=mix(1,0.9,aS);
    x.shadowColor='#FFB020'; x.shadowBlur=mix(10,6,aZ);
    let run=null;
    const flush=()=>{ if(run&&run.pts.length>1){ x.strokeStyle='#FFB020'; x.globalAlpha=pa; x.lineWidth=run.w; x.beginPath();
      run.pts.forEach((p,j)=>j?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])); x.stroke(); } run=null; };
    let prev=null;
    for(const [t,p] of ser){ if(t>tcur) break; const Pw=[0,Y(p),Z(t)];
      if(prev){ const A=toScr(prev), B=toScr(Pw);
        if(A[2]<=cam.wmin||B[2]<=cam.wmin){ flush(); if(A[2]>cam.wmin||B[2]>cam.wmin) line(prev,Pw,Math.max(wEnd,TAU*cam.g/Math.max(A[2],B[2],cam.wmin)),pa,'#FFB020'); }
        else { const w0=Math.max(wEnd,TAU*cam.g/B[2]), w=w0>4?Math.round(w0*2)/2:Math.round(w0*8)/8, sa=[cam.sx+A[0]/A[2],cam.sy-A[1]/A[2]], sb=[cam.sx+B[0]/B[2],cam.sy-B[1]/B[2]];
          if(!run||run.w!==w){ flush(); run={w,pts:[sa]}; } run.pts.push(sb); } }
      prev=Pw; }
    flush();
    /* точка: всегда в (sx, sy) — она и есть цель камеры; пульс стихает, к концу — комета лестницы */
    const ph=performance.now()/110, s=mix(12,8.1,aS)+3*Math.sin(ph)*(1-aO);
    x.globalAlpha=1; x.fillStyle='#FFB020'; x.shadowBlur=mix(24+10*Math.sin(ph),12,aS);
    x.fillRect(cam.sx-s/2,cam.sy-s/2,s,s); x.shadowBlur=0;
    if(aS>0.05){ x.globalAlpha=aS; x.fillStyle='#F2EFE6'; x.fillRect(cam.sx-1,cam.sy-1,2,2); }
    if(aZ<0.99){ const vg=x.createRadialGradient(cx,cy,H*0.18,cx,cy,H*0.75);   // виньетка погони, на выезде уходит
      vg.addColorStop(0,'rgba(7,8,11,0)'); vg.addColorStop(1,'rgba(7,8,11,.78)');
      x.globalAlpha=1-aZ; x.fillStyle=vg; x.fillRect(0,0,W,H); }
    x.globalAlpha=1;                                                     // время — на табло (recHud), не на холсте
  }
  return {draw};
}
/* табло гонки (#rechud): время, цена и зона с числом голосов за неё — меняется на ходу, при смене зоны
   строка «тикает»; на финише всё зеленеет: «финиш», точная цена итога, «угадали N» */
function recHud(c,ch){
  const el=$('#rechud'); if(!el) return {update(){},finish(){},hide(){}};
  el.innerHTML='<div class="t"></div><div class="p"></div><div class="z"></div>'; el.className='on';
  const T=el.querySelector('.t'), P=el.querySelector('.p'), Z=el.querySelector('.z'), rr=ch.ranges||[], votes=c.votes||[];
  let lastT=null, lastP=null, lastZ=null;
  const zl=(z,tail)=>`зона <b>${esc(zoneShort(rr,z))}</b> · ${tail}`;
  return {
    update(info){ if(!info||!info.cur) return; const [t,p]=info.cur;
      if(t!==lastT){ lastT=t; lastP=p; T.textContent=fmtDT(t); P.textContent=fmtP(p); }
      const z=info.curZone; if(z>=0&&z!==lastZ){ const first=lastZ==null; lastZ=z; const n=votes[z]||0;
        Z.innerHTML=zl(z,`${n} ${plRu(n,['голос','голоса','голосов'])}`);
        if(!first){ Z.classList.remove('tick'); void Z.offsetWidth; Z.classList.add('tick'); } } },
    finish(){ el.classList.add('fin'); T.textContent='финиш · '+fmtDT(c.target_time);
      if(c.winner_price!=null) countTo(P,c.winner_price,{fmt:v=>fmtP(v),from:lastP!=null?lastP:c.winner_price,dur:500});
      if(c.winner_option!=null&&c.winner_option>=0) Z.innerHTML=zl(c.winner_option,`угадали ${(c.winners||[]).length}`); },
    hide(){ el.className=''; el.innerHTML=''; }
  };
}
/* сегментный прогресс-бар: i — активный сегмент, ms — сколько он длится */
function recBar(i,ms){ $$('#recbar i').forEach((el,k)=>{ el.classList.toggle('done',k<i); el.classList.toggle('active',k===i);
  if(k===i) el.style.setProperty('--d',ms+'ms'); }); }
function recDate(c){ const d=new Date(c.target_time);
  return new Intl.DateTimeFormat('ru-RU',{...MSK,weekday:'short',day:'numeric',month:'long'}).format(d)+', '
    +new Intl.DateTimeFormat('ru-RU',{...MSK,hour:'2-digit',minute:'2-digit'}).format(d)+' МСК'; }
function recHook(c,ch){
  const total=c.total||0;
  return `<div class="big" style="font-size:100px">ИТОГ</div>
    <div class="sub" style="font-size:22px">#ктоточнее · ${esc(symName(ch&&ch.symbol))}</div>
    ${total?`<div class="q">${total} ${plRu(total,['прогноз','прогноза','прогнозов'])}.<br>Кто угадал?</div>`:''}
    <div class="dim">${esc(recDate(c))}</div>
    <div class="arrow">↓</div>`;
}
const recDotStep=won=>Math.min(45,900/Math.max(1,won));      // мс между загоранием квадратов угадавших
function recResult(c,ch){
  const won=(c.winners||[]).length, total=Math.max(c.total||0,won);
  /* сетка: квадрат на голос в поле ~320×210, угадавшие идут первыми и загораются по очереди */
  const n=Math.max(1,total), cols=Math.max(5,Math.ceil(Math.sqrt(n*320/210))), rows=Math.ceil(n/cols);
  const cell=Math.min(30,Math.floor(Math.min(320/cols,210/rows))), gap=cell>=16?5:2, sz=cell-gap, step=recDotStep(won);
  const dots=Array.from({length:total},(_,i)=>`<i style="animation-delay:${Math.min(i*5,350)}ms">${
    i<won?`<b style="animation-delay:${Math.round(350+i*step)}ms"></b>`:''}</i>`).join('');
  return `<div class="k">финиш · ${esc(symName(ch&&ch.symbol))} · ${esc(recDate(c))}</div>
    <div class="huge">${fmtP(c.winner_price)}</div>
    <div class="sub">зона ${esc(zoneShort(ch.ranges,c.winner_option))}</div>
    ${total?`<div class="dots" style="grid-template-columns:repeat(${cols},${sz}px);--c:${sz}px;--g:${gap}px">${dots}</div>`:''}
    <div class="score"><span class="num" id="recwon">0</span>${total?`<span class="of">из ${total}</span>`:''}</div>
    <div class="k" style="margin-top:6px">${won?'угадали · каждому медаль':'не угадал никто — рынок победил всех'}</div>`;
}

/* Сценарий (~22 с): хук 1.7 → реплей ~6 + финиш 1.0 (табло гонки внизу кадра) → цифры финиша 2.6 → звания ≤4.4 →
   топ-10 ≤3.9 → призыв 2.6 (остаётся). Карточки сменяются «пушем» (recShow) */
async function runRecording(id){
  const c=contests().find(x=>x.status==='resolved'&&chartIdOf(x)===id); const ch=S.charts[id];
  const ups=readUpsParam();
  window.__replayStart=performance.now();
  recBar(0,1800); recShow(recHook(c,ch),{slide:false,jolt:true}); await recSleep(1300);   // «ИТОГ» вбивается с толчком кадра
  const big=$('#reccard .big'); if(big) big.classList.add('zoom');       // «ИТОГ» раздувается на весь экран
  await recSleep(380);
  recCover(true);                                                        // сплошной жёлтый
  recBar(1,7400); recHide();
  /* 3D-пролёт за точкой, затем один непрерывный проезд камеры, который заканчивается ровно
     2D-лестницей (recFlight: доли гонки 0.3→0.72); дальше гонка идёт на лестнице */
  const flight=recFlight(ch,0.3,0.72), hud=recHud(c,ch);
  window.__recCam=(info,u)=>{ hud.update(info); flight.draw(info,u); };
  window.__recFin=()=>hud.finish();
  const race=new Promise(res=>{ window.__recResolve=res; });            // finishReplay: punch + вспышка, ход через 1.3 с
  openReplay(id);
  await recSleep(90);                                                    // первый кадр тоннеля нарисован под заливкой
  recCover(false);                                                       // заливка уходит — мы летим за точкой
  await race;
  window.__recCam=null; window.__recFin=null;
  recBar(2,2600); recShow(recResult(c,ch));                             // карточка цифр въезжает поверх финиша
  setTimeout(()=>hud.hide(),400);                                        // табло уходит под въехавшей карточкой
  const we=$('#recwon'), won=(c.winners||[]).length, dw=Math.max(1,won)*recDotStep(won);
  if(we&&won) setTimeout(()=>{ const t0=performance.now();               // счёт идёт ровно за загорающимися квадратами
    (function f(t){ const k=Math.min(1,(t-t0)/dw); we.textContent=String(Math.min(won,Math.floor(k*won)+1));
      if(k<1) requestAnimationFrame(f); })(t0); },350);
  await recSleep(2600);
  if(ups.length){ const ms=Math.min(4400,2000+300*Math.min(ups.length,8)); recBar(2,ms); recShow(recUps(ups)); await recSleep(ms); }
  const top=(S.preds.board||[]).slice(0,10);         // рейтинг уже пересчитан: JSON перегенерирован до записи
  if(top.length){ const ms=Math.min(4200,2200+170*top.length); recBar(3,ms); recShow(recTop(top,c)); await recSleep(ms); }
  recBar(4,2600); recShow(recCta()); await recSleep(2600);
  $$('#recbar i').forEach(el=>el.classList.add('done'));
  window.__replayDone=performance.now(); document.title='replay-done';   // ролик заканчивается на призыве
}
